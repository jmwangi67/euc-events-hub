name: Database foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run test:db:guard
      # Creates only the project bridge, defaulting publications to 127.0.0.1.
      # Effective Docker mappings AND live Linux listeners must agree; no skips.
      - run: npm run db:verify -- --local --disposable
      - name: Stop only B2a services and retain data volumes
        if: always()
        run: npm run db:stop -- --local
